name: mobile
description: "US Visa Processing Center Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0
  get_it: ^9.2.0
  intl: ^0.19.0
  riverpod_annotation: ^2.6.1
  
  # Data
  supabase_flutter: ^2.8.3
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.2.0
  
  # Features
  flutter_stripe: ^11.5.0
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_face_detection: ^0.13.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  audioplayers: ^6.4.0
  
  # UI
  google_fonts: ^6.3.0
  flutter_form_builder: ^9.5.0
  flutter_animate: ^4.5.0
  skeletonizer: ^1.4.3
  haptic_feedback: ^0.6.4+3
  lucide_icons: ^0.257.0
  rive: ^0.13.20
  permission_handler: ^12.0.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  riverpod_generator: ^2.6.3

dependency_overrides:
  app_links: 6.3.2
  js: ^0.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/js/
